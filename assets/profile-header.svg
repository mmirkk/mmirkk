<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">@mmirkk — automation, data and digital solutions</title>
  <desc id="desc">A retro-tech banner in charcoal, sage, cream, and rust featuring the @mmirkk name and an abstract connected-systems diagram.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20262d"/>
      <stop offset="0.58" stop-color="#293730"/>
      <stop offset="1" stop-color="#171d22"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#738776"/>
      <stop offset="0.62" stop-color="#e5d5a2"/>
      <stop offset="1" stop-color="#9a3f29"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e5d5a2" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <circle cx="1054" cy="54" r="94" fill="#e5d5a2" fill-opacity="0.10" filter="url(#soft-glow)"/>
    <circle cx="996" cy="291" r="116" fill="#738776" fill-opacity="0.14" filter="url(#soft-glow)"/>

    <rect x="43" y="42" width="8" height="8" rx="2" fill="#9a3f29"/>
    <text x="65" y="50" fill="#c6ba8d" font-family="Consolas, 'SFMono-Regular', monospace" font-size="13" letter-spacing="2.2">N8N / POWER BI / REACT / NODE.JS / PYTHON</text>

    <text x="42" y="190" fill="#faefc4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="86" font-weight="750" letter-spacing="-4">@mmirkk</text>
    <rect x="46" y="216" width="326" height="5" rx="2.5" fill="url(#signal)"/>
    <text x="43" y="266" fill="#e5d5a2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.3">AUTOMATION / DATA / DIGITAL SOLUTIONS</text>

    <g transform="translate(692 42)">
      <rect x="0" y="0" width="456" height="276" rx="18" fill="#8d9f8c" fill-opacity="0.065" stroke="#e5d5a2" stroke-opacity="0.16"/>
      <text x="24" y="33" fill="#8d9f8c" font-family="Consolas, 'SFMono-Regular', monospace" font-size="11" letter-spacing="1.6">SYSTEM / FLOW</text>
      <circle cx="414" cy="28" r="4" fill="#9a3f29"/>

      <path d="M72 138C136 138 145 78 220 78S299 138 374 138" fill="none" stroke="#738776" stroke-width="2"/>
      <path d="M72 138C137 138 149 208 220 208S303 138 374 138" fill="none" stroke="#e5d5a2" stroke-opacity="0.74" stroke-width="2.5"/>
      <path d="M220 78V208" fill="none" stroke="#8d9f8c" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 7"/>

      <g transform="translate(48 114)">
        <rect width="48" height="48" rx="13" fill="#28342f" stroke="#738776"/>
        <circle cx="24" cy="24" r="7" fill="#9a3f29"/>
      </g>
      <g transform="translate(196 54)">
        <rect width="48" height="48" rx="13" fill="#28342f" stroke="#8d9f8c"/>
        <path d="M15 28h18M15 21h18" stroke="#e5d5a2" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(196 184)">
        <rect width="48" height="48" rx="13" fill="#e5d5a2"/>
        <path d="m15 25 6 6 13-15" fill="none" stroke="#293730" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(350 114)">
        <rect width="48" height="48" rx="13" fill="#28342f" stroke="#9a3f29"/>
        <path d="M15 24h18M24 15v18" stroke="#c66d4f" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="48" y="183" fill="#8d9f8c" font-family="Consolas, 'SFMono-Regular', monospace" font-size="10" letter-spacing="1.2">INPUT</text>
      <text x="184" y="123" fill="#8d9f8c" font-family="Consolas, 'SFMono-Regular', monospace" font-size="10" letter-spacing="1.2">UNDERSTAND</text>
      <text x="197" y="254" fill="#c66d4f" font-family="Consolas, 'SFMono-Regular', monospace" font-size="10" letter-spacing="1.2">AUTOMATE</text>
      <text x="342" y="183" fill="#8d9f8c" font-family="Consolas, 'SFMono-Regular', monospace" font-size="10" letter-spacing="1.2">SHIP</text>
    </g>

    <rect width="1200" height="360" fill="#ffffff" filter="url(#grain)" opacity="0.52" pointer-events="none"/>
    <rect x="0" y="351" width="1200" height="9" fill="url(#signal)"/>
  </g>
</svg>
